name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install Python deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: "22"
      - name: DSH bridge
        if: runner.os != 'Windows'
        run: node extras/dsh/test-bridge.mjs && node extras/dsh/test-apply.mjs
      - name: First run
        if: runner.os != 'Windows'
        run: ./scripts/first_run.sh
      - name: One-line install, dry run
        run: python scripts/bootstrap.py --dry-run --lang en --vault ci-vault
